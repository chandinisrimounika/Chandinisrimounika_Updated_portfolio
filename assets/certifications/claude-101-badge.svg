<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#C25E3E"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#C25E3E" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Badge Shield / Hexagon -->
  <path d="M 160 16 L 280 60 L 280 180 C 280 240, 210 285, 160 304 C 110 285, 40 240, 40 180 L 40 60 Z" 
        fill="#FAF8F5" stroke="url(#claudeGrad)" stroke-width="6" filter="url(#badgeShadow)"/>
  
  <!-- Inner Border -->
  <path d="M 160 28 L 268 68 L 268 176 C 268 230, 204 271, 160 288 C 116 271, 52 230, 52 176 L 52 68 Z" 
        fill="#FFFFFF" stroke="#E8E1D9" stroke-width="2"/>

  <!-- Anthropic Claude Spark / Star Icon -->
  <g transform="translate(160, 110)">
    <circle cx="0" cy="0" r="44" fill="url(#claudeGrad)"/>
    <!-- Stylized spark rays -->
    <path d="M 0 -28 C 1 -10, 10 -1, 28 0 C 10 1, 1 10, 0 28 C -1 10, -10 1, -28 0 C -10 -1, -1 -10, 0 -28 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="4" fill="#C25E3E"/>
  </g>

  <!-- Typography -->
  <text x="160" y="188" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="800" fill="#1C1917" text-anchor="middle" letter-spacing="1.5">CLAUDE 101</text>
  <text x="160" y="210" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#C25E3E" text-anchor="middle" letter-spacing="0.5">CLAUDE ACADEMY</text>
  <text x="160" y="230" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#78716C" text-anchor="middle">Issued September 17, 2026</text>
  
  <!-- Verified Badge Tick -->
  <g transform="translate(160, 258)">
    <rect x="-42" y="-11" width="84" height="22" rx="11" fill="#E8E1D9" fill-opacity="0.6"/>
    <text x="0" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#44403C" text-anchor="middle" letter-spacing="0.5">VERIFIED</text>
  </g>
</svg>
