<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="claudeCodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#C25E3E"/>
    </linearGradient>
    <filter id="badgeShadowCode" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Badge Shield / Hexagon -->
  <path d="M 160 16 L 280 60 L 280 180 C 280 240, 210 285, 160 304 C 110 285, 40 240, 40 180 L 40 60 Z" 
        fill="#FAF8F5" stroke="url(#accentTerracotta)" stroke-width="6" filter="url(#badgeShadowCode)"/>
  
  <!-- Inner Fill with Slate/Terminal Dark Tone -->
  <path d="M 160 28 L 268 68 L 268 176 C 268 230, 204 271, 160 288 C 116 271, 52 230, 52 176 L 52 68 Z" 
        fill="url(#claudeCodeGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Terminal / Code Prompt in Action Icon -->
  <g transform="translate(160, 108)">
    <rect x="-36" y="-28" width="72" height="56" rx="8" fill="#090D16" stroke="#475569" stroke-width="2"/>
    <circle cx="-24" cy="-18" r="2.5" fill="#EF4444"/>
    <circle cx="-16" cy="-18" r="2.5" fill="#F59E0B"/>
    <circle cx="-8" cy="-18" r="2.5" fill="#10B981"/>
    <!-- Terminal prompt symbol >_ -->
    <path d="M -22 -4 L -12 4 L -22 12" stroke="#D97757" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="-6" y1="12" x2="16" y2="12" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="160" y="184" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">CLAUDE CODE</text>
  <text x="160" y="204" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#D97757" text-anchor="middle" letter-spacing="0.5">IN ACTION</text>
  <text x="160" y="224" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Claude Academy</text>
  <text x="160" y="240" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="400" fill="#64748B" text-anchor="middle">September 17, 2026</text>
  
  <!-- Agentic Workflow Pill -->
  <g transform="translate(160, 262)">
    <rect x="-50" y="-10" width="100" height="20" rx="10" fill="#334155" fill-opacity="0.8"/>
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.5">AGENTIC CLI</text>
  </g>
</svg>
