<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="naukriBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0369A1" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Certificate Card Background -->
  <rect x="10" y="10" width="380" height="260" rx="16" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2" filter="url(#cardShadow)"/>
  
  <!-- Accent Top Bar -->
  <path d="M 10 26 C 10 17.16 17.16 10 26 10 L 374 10 C 382.84 10 390 17.16 390 26 L 390 32 L 10 32 Z" fill="url(#naukriBlue)"/>

  <!-- Naukri Logo Text & Badge -->
  <text x="36" y="65" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#0369A1" letter-spacing="-0.5">naukri<tspan fill="#F59E0B">campus</tspan></text>
  
  <rect x="250" y="48" width="114" height="24" rx="12" fill="#E0F2FE"/>
  <text x="307" y="64" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0284C7" text-anchor="middle">CERTIFICATE OF MERIT</text>

  <!-- Large Percentile Callout -->
  <g transform="translate(36, 92)">
    <rect x="0" y="0" width="328" height="74" rx="12" fill="#F0F9FF" stroke="#E0F2FE" stroke-width="1.5"/>
    <text x="24" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0284C7" letter-spacing="0.5">YOUNG TURKS 2026 SCORE</text>
    <text x="24" y="62" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="800" fill="#0369A1">93.28 <tspan font-size="15" font-weight="600">Percentile Nationwide</tspan></text>
    
    <!-- Star / Trophy Emblem -->
    <circle cx="288" cy="37" r="22" fill="#0284C7"/>
    <path d="M 288 23 L 292 31 L 301 32 L 294 38 L 296 47 L 288 42 L 280 47 L 282 38 L 275 32 L 284 31 Z" fill="#FDE047"/>
  </g>

  <!-- Awardee Info -->
  <text x="36" y="196" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Chandini Sri Mounika Vissamsetti</text>
  <text x="36" y="214" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748B">National Engineering & Problem-Solving Assessment</text>
  
  <line x1="36" y1="228" x2="364" y2="228" stroke="#F1F5F9" stroke-width="1.5"/>

  <!-- Footer Verification & Date -->
  <text x="36" y="248" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#0284C7">ID: 6acf479696ebe313e740afd9</text>
  <text x="364" y="248" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748B" text-anchor="end">October 19, 2026</text>
</svg>
