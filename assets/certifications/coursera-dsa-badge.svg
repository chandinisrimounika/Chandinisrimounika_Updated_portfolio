<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="courseraBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056D2"/>
      <stop offset="100%" stop-color="#002D72"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="280" height="280" rx="24" fill="#FFFFFF" stroke="#0056D2" stroke-width="4"/>
  <rect x="28" y="28" width="264" height="264" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Coursera Geometric Diamond / DSA Graph Emblem -->
  <g transform="translate(160, 110)">
    <circle cx="0" cy="0" r="46" fill="url(#courseraBlue)"/>
    <!-- Binary Tree / Graph Nodes -->
    <circle cx="0" cy="-22" r="7" fill="#FFFFFF"/>
    <circle cx="-20" cy="14" r="7" fill="#FFFFFF"/>
    <circle cx="20" cy="14" r="7" fill="#FFFFFF"/>
    <line x1="0" y1="-15" x2="-20" y2="7" stroke="#93C5FD" stroke-width="3"/>
    <line x1="0" y1="-15" x2="20" y2="7" stroke="#93C5FD" stroke-width="3"/>
  </g>

  <!-- Typography -->
  <text x="160" y="190" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#0056D2" text-anchor="middle">C++ DSA</text>
  <text x="160" y="210" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">SPECIALIZATION</text>
  <text x="160" y="230" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">Coursera &amp; Codio</text>

  <!-- Verified Pill -->
  <g transform="translate(160, 260)">
    <rect x="-60" y="-10" width="120" height="20" rx="10" fill="#DBEAFE"/>
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#1D4ED8" text-anchor="middle">VERIFIED CREDENTIAL</text>
  </g>
</svg>
