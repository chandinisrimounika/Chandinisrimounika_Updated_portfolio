<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="sharkGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="160" cy="160" r="140" fill="url(#oceanGrad)" stroke="#38BDF8" stroke-width="4" filter="url(#sharkGlow)"/>
  
  <!-- Shark Fin & Waves -->
  <path d="M 80 180 C 120 170, 140 130, 160 100 C 170 140, 190 170, 240 180 C 210 195, 170 190, 160 190 C 150 190, 110 195, 80 180 Z" fill="#38BDF8"/>
  <path d="M 60 200 C 100 190, 140 210, 180 195 C 220 180, 240 205, 260 200" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Pull Request Symbol -->
  <g transform="translate(160, 140)">
    <circle cx="-16" cy="-20" r="6" fill="#FFFFFF"/>
    <circle cx="-16" cy="14" r="6" fill="#FFFFFF"/>
    <circle cx="16" cy="0" r="6" fill="#38BDF8"/>
    <line x1="-16" y1="-14" x2="-16" y2="8" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M -16 -8 C 0 -8, 16 -10, 16 -6" stroke="#FFFFFF" stroke-width="3" fill="none"/>
  </g>

  <!-- Title -->
  <text x="160" y="240" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="1.5">PULL SHARK</text>
  <text x="160" y="260" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#7DD3FC" text-anchor="middle">GITHUB PROFILE ACHIEVEMENT</text>
</svg>
