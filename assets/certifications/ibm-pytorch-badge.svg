<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="pytorchFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE4C2C"/>
      <stop offset="100%" stop-color="#C25E3E"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="280" height="280" rx="24" fill="#FFFFFF" stroke="#EE4C2C" stroke-width="4"/>
  <rect x="28" y="28" width="264" height="264" rx="18" fill="#FDFBFB" stroke="#FEE2E2" stroke-width="1"/>

  <!-- Flame / Neural Net Symbol -->
  <g transform="translate(160, 110)">
    <circle cx="0" cy="0" r="46" fill="url(#pytorchFlame)"/>
    <path d="M 0 -22 C 8 -12, 18 -2, 16 12 C 14 20, 6 24, 0 24 C -6 24, -14 20, -16 12 C -18 -2, -8 -12, 0 -22 Z" fill="#FFFFFF"/>
    <circle cx="8" cy="-14" r="3.5" fill="#EE4C2C"/>
  </g>

  <text x="160" y="190" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#1C1917" text-anchor="middle">DEEP LEARNING</text>
  <text x="160" y="210" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#EE4C2C" text-anchor="middle">WITH PYTORCH</text>
  <text x="160" y="230" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#78716C" text-anchor="middle">IBM / Coursera</text>

  <g transform="translate(160, 260)">
    <rect x="-45" y="-10" width="90" height="20" rx="10" fill="#FEE2E2"/>
    <text x="0" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#991B1B" text-anchor="middle">AUGUST 2025</text>
  </g>
</svg>
